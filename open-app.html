<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opening app...</title>
<style>
body{font-family:sans-serif;text-align:center;padding:40px 20px;color:#333}
a.btn{display:inline-block;margin-top:20px;padding:12px 28px;background:#4caf50;color:#fff;
border-radius:10px;text-decoration:none;font-weight:bold}
</style>
</head>
<body>
<h2 id="msg">Opening app...</h2>
<p>If nothing happens, <a id="store" href="#">tap here to get the app</a>.</p>
<script>
// ?scheme=hiddify&store=<url>&name=Hiddify&package=app.hiddify.com
var q = new URLSearchParams(location.search);
var scheme = q.get('scheme') || '';
var store = q.get('store') || '';
var name = q.get('name') || 'the app';
var pkg = q.get('package') || '';
document.getElementById('msg').textContent = 'Opening ' + name + '...';
document.getElementById('store').href = store;

var ua = navigator.userAgent || '';
var isAndroid = /Android/i.test(ua);

if (isAndroid && pkg) {
    // Launch by package name — works even without custom scheme
    var fallback = encodeURIComponent(store);
    var intentUrl = 'intent:#Intent;package=' + pkg +
        ';S.browser_fallback_url=' + fallback + ';end';
    window.location = intentUrl;
    // Fallback timer in case intent is ignored
    setTimeout(function(){
        if (!document.hidden && store) window.location = store;
    }, 2000);
} else if (scheme) {
    // iOS / desktop: try custom scheme, fallback to store
    var iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    iframe.src = scheme + '://';
    document.body.appendChild(iframe);
    setTimeout(function(){ window.location = scheme + '://'; }, 100);
    var gone = false;
    document.addEventListener('visibilitychange', function(){
        if (document.hidden) gone = true;
    });
    setTimeout(function(){
        if (!gone && store) window.location = store;
    }, 1800);
} else if (store) {
    window.location = store;
}
</script>
</body>
</html>
